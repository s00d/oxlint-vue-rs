[package]
name = "oxlint-vue-rs"
version = "0.1.4"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "All eslint-plugin-vue rules oxlint lacks (template + script) on the oxc toolchain, with eslint-plugin-vue parity"
repository = "https://github.com/s00d/oxlint-vue-rs"
homepage = "https://github.com/s00d/oxlint-vue-rs"
readme = "README.md"
keywords = ["vue", "oxlint", "linter", "eslint", "oxc"]
categories = ["development-tools", "command-line-utilities"]
include = ["/src/**/*", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[dependencies]
ignore = "0.4"
globset = "0.4"
oxc = { version = "0.158.0", features = ["semantic", "ast_visit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regress = "0.12"
node-semver = "2.2"
feruca = "0.13"

[[bin]]
name = "oxlint-vue-rs"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
# Fix-verification harness (tests/fixcheck): compare script ASTs via codegen.
oxc = { version = "0.158.0", features = ["semantic", "ast_visit", "codegen"] }
