# Build prebuilt binaries for every platform, attach them and the npm tarballs to a GitHub release, and
# (optionally) publish the npm packages.
#
# Run manually: Actions → release → Run workflow.
#   github_release (default true):  GitHub release `<version>` (from Cargo.toml, no `v` prefix) with the binaries and
#                                   the npm tarballs; an existing release gets its assets replaced.
#   npm_publish    (default false): also publish the npm packages (NPM_TOKEN secret, or npm trusted publishing /
#                                   OIDC when the secret is unset). Versions already on npm are skipped.
# With both off it is a dry run: everything is built and kept as workflow artifacts.
name: release

on:
  workflow_dispatch:
    inputs:
      github_release:
        description: Create/update the GitHub release with binaries and npm tarballs
        type: boolean
        default: true
      npm_publish:
        description: Also publish the npm packages
        type: boolean
        default: false

# Least privilege: jobs only read the repo; `npm` and `github-release` widen it for what they need.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release --locked

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-15 }
          - { target: x86_64-apple-darwin, runner: macos-15 }
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-22.04, musl: true }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-22.04-arm, musl: true }
          - { target: x86_64-pc-windows-msvc, runner: windows-2022 }
          - { target: aarch64-pc-windows-msvc, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/oxlint-vue-rs
          [ -f "$bin.exe" ] && bin="$bin.exe"
          run=("$bin")
          # x86_64 macOS binary on the arm64 runner: through Rosetta when it is installed.
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
            if arch -x86_64 /usr/bin/true 2>/dev/null; then run=(arch -x86_64 "$bin"); else run=(); echo "::notice::no Rosetta, smoke test skipped"; fi
          fi
          if [ ${#run[@]} -gt 0 ]; then
            "${run[@]}" --version
            printf '<template><div v-for="i in x">{{i}}</div></template>\n' > smoke.vue
            # exactly 1 = problems found; 0 = rule did not fire, 2 = usage error, 101 = panic
            set +e; "${run[@]}" --no-oxlint -D require-v-for-key smoke.vue; rc=$?; set -e
            [ "$rc" -eq 1 ] || { echo "::error::smoke test: expected exit 1, got $rc"; exit 1; }
          fi
          mkdir -p out && cp "$bin" out/
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  npm:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write # npm provenance / trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble packages
        shell: bash
        run: |
          for dir in artifacts/bin-*; do
            target=${dir#artifacts/bin-}
            bins=("$dir"/oxlint-vue-rs*)
            node scripts/npm/pack.mjs platform "$target" "${bins[0]}"
          done
          node scripts/npm/pack.mjs main
          ls dist-npm
          mkdir -p tarballs
          for p in dist-npm/platforms/* dist-npm/oxlint-vue-rs; do (cd "$p" && npm pack --pack-destination "$GITHUB_WORKSPACE/tarballs"); done
      - name: publint
        shell: bash
        run: for p in dist-npm/platforms/* dist-npm/oxlint-vue-rs; do npx --yes publint@0.3 run "$p" --strict; done
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: tarballs/*.tgz
      - name: Publish to npm
        if: inputs.npm_publish
        env:
          # Empty secret → npm >= 11.5 uses trusted publishing (OIDC); the first publish of a name needs a token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          npm install -g npm@^11.5.1
          publish() {
            local name version
            name=$(node -p 'require(require("path").resolve(process.argv[1], "package.json")).name' "$1")
            version=$(node -p 'require(require("path").resolve(process.argv[1], "package.json")).version' "$1")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm, skipped"
            else
              (cd "$1" && npm publish --access public --provenance)
              sleep 30 # space out publishes: many new similar names at once trip npm's spam detection
            fi
          }
          # platform packages first, the main package (which depends on them) last
          for p in dist-npm/platforms/*; do publish "$p"; done
          publish dist-npm/oxlint-vue-rs

  github-release:
    needs: npm
    if: inputs.github_release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p rel
          for dir in artifacts/bin-*; do
            target=${dir#artifacts/bin-}
            for f in "$dir"/*; do cp "$f" "rel/$(basename "${f%.exe}")-$target$( [[ $f == *.exe ]] && echo .exe)"; done
          done
          if gh release view "$version" >/dev/null 2>&1; then
            gh release upload "$version" rel/* artifacts/npm-tarballs/*.tgz --clobber
          else
            gh release create "$version" rel/* artifacts/npm-tarballs/*.tgz --title "$version" --notes-file RELEASE_NOTES.md --latest --target "$GITHUB_SHA"
          fi
