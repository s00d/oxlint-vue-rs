name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: npm package smoke test
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo build --release
          cargo build --release -p oxlint-vue-rs-napi
          addon=$(ls target/release/liboxlint_vue_rs_napi.so target/release/liboxlint_vue_rs_napi.dylib 2>/dev/null | head -n1)
          node scripts/npm/pack.mjs main
          node scripts/npm/pack.mjs platform "$(rustc -vV | sed -n 's/^host: //p')" target/release/oxlint-vue-rs "$addon"
          for p in dist-npm/platforms/* dist-npm/oxlint-vue-rs; do npx --yes publint@0.3 run "$p" --strict; done
          node -e "import('./dist-npm/oxlint-vue-rs/index.js').then(m => { if (Object.keys(m.default.rules).length !== 210) process.exit(1) })"
          # Released oxlint accepts the plugin and stays quiet (the oxc PR #28720 tests skip without OXLINT_PR).
          npm i --no-save --prefix "$RUNNER_TEMP/oxlint" oxlint@1.93.0
          OXLINT_RELEASED="$RUNNER_TEMP/oxlint/node_modules/.bin/oxlint" node --test tests/oxlint-plugin/oxlint-plugin.test.mjs
